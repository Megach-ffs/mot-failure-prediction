[project]
name = "motfail"
version = "0.1.0"
description = "Predicting MOT test failure of cars in Great Britain from pre-test vehicle facts (DVSA open data)"
readme = "README.md"
authors = [
    { name = "megach-ffs", email = "132559280+Megach-ffs@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "remotezip>=0.12.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.15",
    "seaborn>=0.13.2",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
